name: Sync VBL calendar

on:
  schedule:
    # 05:00 UTC ≈ 06:00/07:00 Belgian time depending on DST — adjust as needed
    - cron: "0 5 * * *"
  workflow_dispatch: {}

jobs:
  sync:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: REFEREEE
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: python sync_vbl.py
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
