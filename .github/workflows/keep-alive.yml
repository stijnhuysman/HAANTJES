name: Keep Streamlit app awake

on:
  schedule:
    # Every 6 hours — well within Community Cloud's inactivity window, so the app
    # never gets to the point of being put to sleep.
    - cron: "17 */6 * * *"
  workflow_dispatch: {}

jobs:
  visit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: REFEREEE
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install playwright
      - run: python -m playwright install --with-deps chromium
      - run: python keep_alive.py
